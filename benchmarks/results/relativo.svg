  .other { fill: var(--other); stroke: var(--other); }
  .line { fill: none; stroke-width: 2; }
  .line.glox { stroke-width: 3; }
  .ring { stroke: var(--surface); stroke-width: 2; }
  .bg { fill: var(--surface); }
</style>
<rect class="bg" width="764" height="410" rx="8"/><text class="title" x="24" y="30">Tiempo relativo a glox</text><text class="subtitle" x="24" y="50">Media geométrica en los 5 benchmarks pesados (punto) y rango entre el más y el menos favorable (línea).</text><text class="subtitle" x="24" y="68">A la izquierda de 1× es más rápida que glox, a la derecha más lenta. Escala logarítmica.</text><line class="grid" x1="114.0" y1="84" x2="114.0" y2="360"/><text class="tick" x="114.0" y="376" text-anchor="middle">0.01×</text><line class="grid" x1="226.0" y1="84" x2="226.0" y2="360"/><text class="tick" x="226.0" y="376" text-anchor="middle">0.1×</text><line class="grid" x1="338.0" y1="84" x2="338.0" y2="360"/><text class="tick" x="338.0" y="376" text-anchor="middle">1×</text><line class="grid" x1="450.0" y1="84" x2="450.0" y2="360"/><text class="tick" x="450.0" y="376" text-anchor="middle">10×</text><line class="grid" x1="562.0" y1="84" x2="562.0" y2="360"/><text class="tick" x="562.0" y="376" text-anchor="middle">100×</text><line class="grid" x1="674.0" y1="84" x2="674.0" y2="360"/><text class="tick" x="674.0" y="376" text-anchor="middle">1000×</text><text class="label" x="102" y="109.0" text-anchor="end">rlox</text><line class="bytecode" x1="225.3" y1="105.0" x2="240.7" y2="105.0" stroke-width="2" stroke-linecap="round" opacity="0.55"/><path class="bytecode ring" d="M234.0,97.5 L241.5,105.0 L234.0,112.5 L226.5,105.0 Z"/><text class="value" x="252.7" y="109.0">0.12×</text><text class="label" x="102" y="139.0" text-anchor="end">loxx</text><line class="bytecode" x1="231.3" y1="135.0" x2="273.5" y2="135.0" stroke-width="2" stroke-linecap="round" opacity="0.55"/><path class="bytecode ring" d="M245.0,127.5 L252.5,135.0 L245.0,142.5 L237.5,135.0 Z"/><text class="value" x="285.5" y="139.0">0.15×</text><text class="label" x="102" y="169.0" text-anchor="end">jlox</text><line class="other" x1="311.8" y1="165.0" x2="344.6" y2="165.0" stroke-width="2" stroke-linecap="round" opacity="0.55"/><circle class="other ring" cx="325.4" cy="165.0" r="6"/><text class="value" x="356.6" y="169.0">0.77×</text><text class="label glox" x="102" y="199.0" text-anchor="end">glox</text><circle class="glox ring" cx="338.0" cy="195.0" r="6"/><text class="value" x="350.0" y="199.0">1.0×</text><text class="label" x="102" y="229.0" text-anchor="end">slox</text><line class="other" x1="414.0" y1="225.0" x2="425.0" y2="225.0" stroke-width="2" stroke-linecap="round" opacity="0.55"/><circle class="other ring" cx="420.3" cy="225.0" r="6"/><text class="value" x="437.0" y="229.0">5.4×</text><text class="label" x="102" y="259.0" text-anchor="end">dlox</text><line class="other" x1="343.3" y1="255.0" x2="541.9" y2="255.0" stroke-width="2" stroke-linecap="round" opacity="0.55"/><circle class="other ring" cx="429.7" cy="255.0" r="6"/><text class="value" x="553.9" y="259.0">6.6×</text><text class="label" x="102" y="289.0" text-anchor="end">plox-php</text><line class="other" x1="460.1" y1="285.0" x2="546.9" y2="285.0" stroke-width="2" stroke-linecap="round" opacity="0.55"/><circle class="other ring" cx="486.7" cy="285.0" r="6"/><text class="value" x="558.9" y="289.0">21×</text><text class="label" x="102" y="319.0" text-anchor="end">cloxure</text><line class="other" x1="432.1" y1="315.0" x2="620.5" y2="315.0" stroke-width="2" stroke-linecap="round" opacity="0.55"/><circle class="other ring" cx="511.8" cy="315.0" r="6"/><text class="value" x="632.5" y="319.0">36×</text><text class="label" x="102" y="349.0" text-anchor="end">plox</text><line class="other" x1="532.9" y1="345.0" x2="549.6" y2="345.0" stroke-width="2" stroke-linecap="round" opacity="0.55"/><circle class="other ring" cx="543.1" cy="345.0" r="6"/><text class="value" x="561.6" y="349.0">68×</text></svg>
