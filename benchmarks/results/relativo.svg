<svg xmlns="http://www.w3.org/2000/svg" width="764" height="410" viewBox="0 0 764 410" role="img" aria-label="Tiempo relativo a glox"><title>Tiempo relativo a glox</title>
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e6e5e1;
        --glox:#2a78d6; --bytecode:#eb6834; --other:#86857f; }
  @media (prefers-color-scheme: dark) {
